version: '3.8'

services:
  sellio-feedback:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sellio-feedback
    restart: unless-stopped
    expose:
      - "5005"
    ports:
      - "5005:5005"
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - default
